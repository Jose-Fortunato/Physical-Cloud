name: Sync from Upstream (preservando commits locais)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/JoseFortunato-coder/Physical-Cloud.git
          git fetch upstream

      # Faz merge das atualizações, preservando commits locais
      - name: Merge upstream changes (preservando locais)
        run: |
          git merge upstream/main --no-ff --no-edit
          git push origin main
